</div>

<div id="player">
  <div class="player-inner">
    <div class="player-top">
      <span id="track-name">—</span>
      <button id="shuffle-btn" title="random track" aria-label="random track">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8"></polyline>
          <line x1="4" y1="20" x2="21" y2="3"></line>
          <polyline points="21 16 21 21 16 21"></polyline>
          <line x1="15" y1="15" x2="21" y2="21"></line>
          <line x1="4" y1="4" x2="9" y2="9"></line>
        </svg>
      </button>
    </div>

    <div class="player-mid">
      <button id="play-btn" aria-label="play or pause">
        <svg id="icon-play" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><polygon points="6 4 20 12 6 20"></polygon></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="display:none"><rect x="5" y="4" width="5" height="16"></rect><rect x="14" y="4" width="5" height="16"></rect></svg>
      </button>

      <span id="time-cur">0:00</span>
      <input id="seek" type="range" min="0" max="100" value="0" step="0.1">
      <span id="time-dur">0:00</span>
    </div>

    <div class="player-bottom">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      </svg>
      <input id="volume" type="range" min="0" max="1" value="0.8" step="0.01">
    </div>
  </div>
